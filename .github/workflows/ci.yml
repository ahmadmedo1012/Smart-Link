name: CI

# r7: جودة المستودع تصبح ذاتية التحقق — كل دفعة أو PR تجتاز
# lint ← parity ← build ← E2E (Playwright + axe-core) قبل أن تصل إلى main.
# r10 (security audit): الملف وُلد في r7 بتلف صامت «branches: ain]» بدل
# «[main]» — GitHub تعامل معه بتساهل فاستمر التشغيل على main، لكن الفلتر
# شكلياً لا يطابق شيئاً: أُصلح إلى [main] صريحاً.
# r126 (P4-F3): أعيد التحقق بايت-ببايت (od -c + python hex) بعد ادعاء
# تدقيق P4-A3 بالتلف: الفلتران سليمان فعلاً `[main]` منذ إصلاح r10
# (8a9cdc4) — «التلف» كان أثر عرضٍ في أدوات الفحص يبتلع `[m` من مخرجات
# cat/rg المضغوطة (الصف نفسه رآه تدقيق P4-A5 في مستودع آخر). أُضيفت
# خطوة parity لـCI أدناه.
on:
  # r191 (widening): every push on ANY branch + every PR — not just main.
  # The repo is public (free Actions minutes) and the concurrency group
  # (ci-<ref>, cancel-in-progress) already collapses rapid pushes to the
  # same ref, so branch coverage costs nothing while a regression is
  # caught at the push itself, before the PR is even opened.
  push:
  pull_request:

# r10 (security audit — least privilege): الرمز الافتراضي GITHUB_TOKEN
# أوسع من حاجة وظيفة قراءة/تشغيل اختبارات.
permissions:
  contents: read

# r10 (testing audit): push متتابع يلغي التشغيل القديم المتقادم
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: lint + build + e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Node 22 + cache
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # r10 (testing audit): ~120MB متصفح تُنزّل في كل تشغيل — كاش
      # بمفتاح lockfile يختصر الدقيقة الأولى من كل CI.
      - name: Playwright browser cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        run: npm ci

      # P21-W5-C2 (audit W5-A2 / security wave): بوابة تدقيق التبعيات —
      # شجرة الإنتاج فقط (--omit=dev) وعتبة high: الثغرة الحرجة في
      # next 16.0.0–16.3.7 (RCE في next/og وستة أخريات، GHSA-vcvr-r3jv-pc5j
      # … GHSA-cjq9-62q9-8jv4) أُصلحت بالترقية داخل الـmajor نفسه (16.3.8)
      # مع sharp 0.35.5 وsource-map-js 1.2.2 (بقعها عابرة في شجرة next).
      # البوابة الصارمة تمنع رجوع أي ثغرة إنتاج عبر ترقية مستقبلية أو
      # تبعية جديدة — تفشل الدفعة مبكراً قبل أي خطوة جودة.
      # (تبعيات dev خارج النطاق عمداً: braces بلا إصدار مُصلَح أصلاً —
      # الإجبار الوحيد downgrade كاسر لـeslint-config-next.)
      - name: Dependency audit (شجرة الإنتاج، عتبة high)
        run: npm audit --omit=dev --audit-level=high

      - name: Lint (ESLint صفر أخطاء)
        run: npm run lint

      # Unit — طبقة node:test بلا أي تبعية (نهج Smart-Order في الأسطولة):
      # الوحدات النقية (phone/money/contact-rules/site) تُثبَّت في أقل من
      # ثانية بدل انتظار بناء Playwright كامل — انحراف طيّ الأرقام
      # الشرقية أو استعادة جذع المحمول أو سقف الأطوال يظهر فوراً.
      - name: Unit tests (node:test، بلا تبعيات)
        run: npm run test:unit

      # r126 (P4-A3 §2.1): Madarek parity — سكربت node بلا تبعيات يقارن
      # جسر التوكنات في styles.css بالقيم القانونية؛ أي انحراف لون/نصف
      # قوس/حركة يفشل الدفعة قبل البناء أصلاً.
      - name: Madarek parity snapshot
        run: npm run test:parity

      # P14-P0B: truth gate — walks ALL of src/ for future-paid-plan
      # claims. The stale claim was fixed on /pricing (P13-2a) and then
      # reappeared from the homepage FAQ — page-level e2e alone cannot
      # see a claim living in an unrendered source file. Zero deps, same
      # pattern as parity.
      - name: Paid-plans truth gate (P14-P0B)
        run: npm run test:truth

      - name: Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Build (يضم tsc صارماً)
        run: npm run build

      # بلا RESEND_API_KEY في CI → عقد الـ API يختبر مسار الفشل
      # الصريح (503) بشكل حتمي — لا بريد يُرسل ولا نجاح كاذب.
      # r10: نفس أمر CLAUDE.md والسكربتات (npm run test:e2e) بدل npx
      # المباشر — مصدر واحد للأمر.
      - name: E2E — Playwright + axe-core
        run: npm run test:e2e

      - name: Upload test artifacts (عند الفشل فقط)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-artifacts
          path: |
            test-results/
            playwright-report/
          retention-days: 7
